services:
  easy-proxies:
    image: ${EASY_PROXIES_IMAGE:-ghcr.io/lieyanc/easy-proxies:latest}
    container_name: easy-proxies
    restart: unless-stopped
    # 方式一：使用主机网络模式（推荐，支持端口自动重分配）
    network_mode: host
    user: "${UID:-10001}:${GID:-10001}"
    # 方式二：手动映射端口（注释掉 network_mode，启用下面的 ports）
    # ports:
    #   # Pool 模式入口（pool/hybrid 模式使用）
    #   - "2323:2323"
    #   # Web 监控面板
    #   - "9091:9091"
    #   # Multi-port 端口范围（multi-port/hybrid 模式使用，根据节点数量调整）
    #   - "24000-24200:24000-24200"
    #
    # 支持的运行模式（在 config.yaml 中配置）：
    #   - pool: 单端口代理池，所有节点共享 2323 端口
    #   - multi-port: 多端口模式，每个节点独立端口
    #   - hybrid: 混合模式，同时启用 pool (2323) + multi-port (24000+)
    #
    # hybrid 模式说明：
    #   - 代理池入口：http://0.0.0.0:2323 / socks5://0.0.0.0:2323（自动负载均衡）
    #   - 独立节点入口：http://0.0.0.0:24000, ... 或 socks5://0.0.0.0:24000, ...（直连特定节点）
    #   - 节点状态在两种入口间共享（黑名单同步）
    #   - 端口冲突时自动重分配到下一个可用端口
    #
    # 使用示例：
    #
    #   方式一：映射配置目录（推荐，零配置启动）
    #     docker run --user $(id -u):$(id -g) -v ./config.yaml:/app/config.yaml -v ./nodes.txt:/app/nodes.txt -v ./logs:/app/logs ghcr.io/lieyanc/easy-proxies:latest
    #
    #   方式二：映射配置文件（传统方式）
    #     docker run -v ./config.yaml:/app/config.yaml -v ./nodes.txt:/app/nodes.txt ghcr.io/lieyanc/easy-proxies:latest
    #
    volumes:
      # 配置文件与二进制同目录：/app/config.yaml 和 /app/nodes.txt
      - ./config.yaml:/app/config.yaml
      - ./nodes.txt:/app/nodes.txt
      - ./logs:/app/logs
