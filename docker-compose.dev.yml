services:
  easy-proxies:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    image: easy-proxies:dev
    container_name: easy-proxies-dev
    restart: unless-stopped
    # macOS 不支持 network_mode: host，必须使用端口映射
    ports:
      - "2323:2323"       # Pool 入口
      - "9091:9091"       # WebUI
      - "24000-24100:24000-24100"  # Multi-port
    user: "${UID:-10001}:${GID:-10001}"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./nodes.txt:/app/nodes.txt
      - ./logs:/app/logs
