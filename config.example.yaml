# ═══════════════════════════════════════════════════════════════
# easy-proxies 完整配置文件
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# 运行模式
# ───────────────────────────────────────────────────────────────
# pool: 单端口代理池，所有节点共享一个端口，自动负载均衡
# multi-port: 多端口模式，每个节点独立端口
# hybrid: 混合模式，同时启用 pool + multi-port
mode: pool

# 日志级别: debug, info, warn, error
log_level: info

# ───────────────────────────────────────────────────────────────
# 日志轮转配置
# ───────────────────────────────────────────────────────────────
# output: "stdout"（仅控制台）或 "file"（控制台+文件轮转），默认 stdout
# file: 日志文件路径，默认 logs/easy-proxies.log
# max_size: 单个日志文件最大 MB，超出后自动轮转，默认 50
# max_backups: 保留旧日志文件个数，默认 3
# max_age: 保留旧日志文件天数，默认 7
# compress: 是否压缩轮转后的旧日志，默认 false
log:
  output: stdout
  file: logs/easy-proxies.log
  max_size: 50
  max_backups: 3
  max_age: 7
  compress: false

# ───────────────────────────────────────────────────────────────
# OTA 更新配置
# ───────────────────────────────────────────────────────────────
# enabled: 是否启用后台更新检查，默认 false
# channel: stable（正式版，下载后自动应用）或 dev（固定 dev 预发布，下载后等待确认）
# check_interval: 后台检查间隔，默认 1h
# proxy_base_url: 已废弃；OTA 现在直接使用 GitHub Releases 下载地址
# repo: GitHub 仓库 owner/name
# use_fastest_node: OTA 检查和下载是否走当前最低延迟节点，默认 false
update:
  enabled: false
  channel: stable
  check_interval: 1h
  proxy_base_url: ""
  repo: lieyanc/easy-proxies
  use_fastest_node: false

# 全局跳过 SSL 证书验证（默认 false，不建议在生产环境启用）
skip_cert_verify: false

# 外部 IP 地址，用于导出配置时替换 0.0.0.0（可选）
# external_ip: "your.public.ip"

# ───────────────────────────────────────────────────────────────
# 监听配置（Pool 模式入口，支持 HTTP/SOCKS5）
# ───────────────────────────────────────────────────────────────
listener:
  address: 0.0.0.0      # 监听地址
  port: 2323            # 监听端口
  username: username    # 代理认证用户名
  password: password    # 代理认证密码

# ───────────────────────────────────────────────────────────────
# 代理池配置
# ───────────────────────────────────────────────────────────────
pool:
  # 调度模式: sequential（顺序）, random（随机）, balance（均衡）, latency（最低延迟）
  mode: sequential
  # 连续失败多少次后加入黑名单
  failure_threshold: 3
  # 黑名单持续时间
  blacklist_duration: 24h
  # 是否启用代理重试：节点拨号失败后自动切换下一个节点重试
  # 多端口模式下池只有 1 个成员，重试会再次拨同一节点
  retry_enabled: true
  # 重试次数（包含首次拨号），默认 3
  retry_attempts: 3
  # 轮询入口（可选，pool/hybrid 模式）：在同一监听端口上额外提供一个
  # 强制轮询调度的用户名入口，与 pool.mode 互不影响。
  # 例如 mode: latency 时，用 <listener.username>-rr 用户名连接即走轮询。
  # 注意：未设置 listener.username 时入口用户名为 rr，且启用后该端口需要用户名认证。
  # round_robin_entry: true
  # 自定义轮询入口用户名（可选），默认 "<listener.username>-rr"
  # round_robin_username: rr

# ───────────────────────────────────────────────────────────────
# 多端口模式配置（multi-port / hybrid 模式使用）
# ───────────────────────────────────────────────────────────────
multi_port:
  address: 0.0.0.0      # 监听地址
  base_port: 24000      # 起始端口号
  username: mpuser      # 默认认证用户名
  password: mppass      # 默认认证密码

# ───────────────────────────────────────────────────────────────
# 管理面板配置
# ───────────────────────────────────────────────────────────────
management:
  enabled: true                                      # 是否启用管理面板
  listen: 127.0.0.1:9091                             # 监听地址；公网/局域网监听必须设置 password
  probe_target: http://cp.cloudflare.com/generate_204  # 健康检查目标
  health_check_interval: 5m                          # 后台健康检查间隔
  health_check_concurrency: 0                         # 后台健康检查并发数；0 表示 CPU 核心数
  password: ""                                       # WebUI 访问密码；仅本机监听允许为空

# ───────────────────────────────────────────────────────────────
# DNS 配置（用于节点域名解析，尤其是 VMess）
# ───────────────────────────────────────────────────────────────
dns:
  server: 223.5.5.5         # DNS 服务器地址
  fallback_servers:          # DNS 解析失败时的备用服务器（主 DNS 为国内 DNS 时自动添加）
    - 8.8.8.8               # Google DNS
    - 1.1.1.1               # Cloudflare DNS
  port: 53                  # DNS 端口
  strategy: prefer_ipv4     # as_is / prefer_ipv4 / prefer_ipv6 / ipv4_only / ipv6_only

# ───────────────────────────────────────────────────────────────
# GeoIP 地域分区配置（可选）
# ───────────────────────────────────────────────────────────────
# 启用后会按节点真实出口 IP 打地域标签（jp/kr/us/hk/tw/sg/other），
# 并在单端口 mixed 入口上用认证用户名选择地区。每个地区池固定按延迟优先选择节点。
geoip:
  enabled: true                      # 是否启用 GeoIP 地域标记
  database_path: "./GeoLite2-Country.mmdb"           # GeoIP 数据库路径（首次启动时自动下载）
  auto_update_enabled: true                          # 是否启用自动更新数据库（推荐）
  auto_update_interval: 24h                          # 自动更新间隔（默认 24 小时）
  exit_ip_probe_mode: interval                       # 出口 IP 探测模式：interval / subscription_refresh
  exit_ip_probe_interval: 5m                         # 出口 IP 探测最小间隔
  download_proxies: []                               # GeoIP 数据库下载代理列表，按顺序重试
  # download_proxies:
  #   - "http://127.0.0.1:7890"
  #   - "socks5://127.0.0.1:7891"
  # 注意：
  #   - 首次启动会自动从 GitHub 下载 GeoIP 数据库（约 9MB）
  #   - 地域识别随健康检查执行，以节点真实出口公网 IP 为准
  #   - 如果 listener.username = "user"，则 user-jp/user-us/... 分别选择地区，user 选择全局池
  #   - 如果 listener.username 为空，则 jp/us/... 分别选择地区，all 选择全局池
  #   - 配置 download_proxies 后会优先使用第一个代理，失败再尝试下一个
  #   - 启用 auto_update_enabled 后，数据库会定期自动更新，无需重启服务
  #   - 更新过程采用热重载，不会中断现有连接

# ───────────────────────────────────────────────────────────────
# 订阅自动刷新配置（可选）
# ───────────────────────────────────────────────────────────────
# subscription_refresh:
#   enabled: false              # 是否启用定时刷新
#   interval: 1h                # 刷新间隔（默认 1 小时）
#   timeout: 30s                # 获取订阅的超时时间
#   health_check_timeout: 60s   # 新节点健康检查超时
#   drain_timeout: 30s          # 旧实例排空超时时间
#   min_available_nodes: 1      # 最少可用节点数，低于此值不切换

# ═══════════════════════════════════════════════════════════════
# 节点配置方式（三选一或混合使用）
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# 方式 1: 订阅链接（推荐，自动获取并写入 nodes.txt）
# ───────────────────────────────────────────────────────────────
# subscriptions:
#   - "https://example.com/subscribe?token=xxx"
#   - "https://another.com/api/v1/client/subscribe?token=yyy"

# ───────────────────────────────────────────────────────────────
# 方式 2: 节点文件（每行一个代理 URI）
# ───────────────────────────────────────────────────────────────
# nodes_file: nodes.txt

# ───────────────────────────────────────────────────────────────
# 方式 3: 直接在配置文件中配置节点
# ───────────────────────────────────────────────────────────────
nodes:
  # 最简配置：只需 URI，名称从 # 后自动提取
  - uri: "vless://uuid@server:443?security=tls&type=ws&path=/path#节点名称"

  # 完整配置：手动指定名称和端口
  # - name: "自定义名称"
  #   uri: "ss://base64@server:8388"
  #   port: 24001              # 手动指定端口（multi-port/hybrid 模式）
  #   username: "custom_user"  # 覆盖默认认证（可选）
  #   password: "custom_pass"

# ───────────────────────────────────────────────────────────────
# 支持的代理协议
# ───────────────────────────────────────────────────────────────
# - Cloudflare WARP: 建议在 WebUI 节点管理中点击“注册 WARP”自动生成
#   warp://PRIVATE_KEY@endpoint:port?peer_public_key=KEY&ipv4=PREFIX&ipv6=PREFIX&reserved=A,B,C&mtu=1280#name
# - VMess:    vmess://base64_encoded_json
# - VLESS:    vless://uuid@server:port?params#name
# - Trojan:   trojan://password@server:port?params#name
# - SS:       ss://method:password@server:port#name
#             ss://base64(method:password)@server:port#name
# - Hysteria2: hy2://password@server:port?params#name
# - SOCKS5:  socks5://[user:pass@]server:port#name
# - HTTP:    http://[user:pass@]server:port#name
#            https://[user:pass@]server:port#name
# 注意：解析器可识别部分额外协议前缀（如 ssr://、hysteria://），
# 但不在文档支持列表中的协议会被跳过并输出日志。
